name: upstream sync

# toolfinity: mirror tracefinity/tracefinity into upstream-main, then try
# merging it into main on a sync branch. a clean merge opens a PR (so CI
# runs); a conflict opens an issue instead, because a conflicted PR never
# triggers CI and would sit there looking green.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    if: github.repository == 'tfcollins/toolfinity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch upstream
        run: |
          git remote add upstream https://github.com/tracefinity/tracefinity.git
          git fetch upstream main
          git push origin upstream/main:refs/heads/upstream-main

      - name: merge into a sync branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "main already contains upstream/main"
            echo "result=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="sync/upstream-$(date -u +%Y-%m-%d)"
          git checkout -B "$branch" origin/main
          if git merge --no-ff --no-edit -s recursive upstream/main; then
            git push -f origin "$branch"
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: open sync PR
        if: steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "sync: merge tracefinity upstream ($(date -u +%Y-%m-%d))" \
            --body "Automated merge of \`tracefinity/tracefinity@main\` into \`main\`. Review the fork hooks listed in FORK.md if upstream touched those files."

      - name: report conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Merging \`tracefinity/tracefinity@main\` into \`main\` conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' /tmp/conflicts.txt
            echo
            echo "Resolve locally (see FORK.md, \"Syncing upstream\") and push a sync branch."
          } > /tmp/body.md
          gh issue create --title "upstream sync conflict ($(date -u +%Y-%m-%d))" --body-file /tmp/body.md
